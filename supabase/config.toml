# Supabase project settings for RC Rampage. Push with `supabase config push` after `supabase link`.
project_id = "rc-rampage"

[api]
# Only `public` is reachable through the Data API. Game tables live in `game` and are never exposed;
# the only public function a browser can call is get_leaderboard().
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 100

[auth]
site_url = "https://carlosfelipetorres1.github.io/RCRampage/"
additional_redirect_urls = ["http://localhost:8777"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.rate_limit]
email_sent = 30
token_verifications = 30
sign_in_sign_ups = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
otp_length = 6
otp_expiry = 600
max_frequency = "60s"

# Both templates carry the 6-digit code ({{ .Token }}) instead of a link: new players get
# "confirmation", returning players get "magic_link".
[auth.email.template.confirmation]
subject = "Your RC Rampage sign-in code"
content_path = "./supabase/templates/code.html"

[auth.email.template.magic_link]
subject = "Your RC Rampage sign-in code"
content_path = "./supabase/templates/code.html"

# Cloudflare Turnstile on sign-in code requests (stops email bombing). The secret is read from the
# environment when pushing config: TURNSTILE_SECRET=... supabase config push
[auth.captcha]
enabled = true
provider = "turnstile"
secret = "env(TURNSTILE_SECRET)"

[auth.external.apple]
enabled = false
[auth.external.google]
enabled = false

# The functions check the user's JWT themselves (after answering CORS preflight), so the gateway check is off.
[functions.profile]
verify_jwt = false
[functions.run-start]
verify_jwt = false
[functions.run-finish]
verify_jwt = false
[functions.shop-buy]
verify_jwt = false
[functions.import-guest]
verify_jwt = false
[functions.delete-account]
verify_jwt = false
